[project]
name = "bedrock-probe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40,<2",
  "httpx>=0.28,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "tiktoken>=0.14,<1"]

[tool.setuptools.packages.find]
include = ["probe*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
